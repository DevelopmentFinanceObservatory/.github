name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately, following the [security policy](https://github.com/DevelopmentFinanceObservatory/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests or clicks, in order.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, release or URL where you saw the problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Remove secrets and personal data first.
      render: text
